<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c0e">
<title>终末地 · 产线倒计时</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{
    --bg:#080a0c;
    --panel:rgba(14,18,22,.86);
    --line:#242c34;
    --txt:#d9e0e6;
    --dim:#6c7783;
    --yellow:#ffd21e;
    --cyan:#4fd0e0;
    --red:#ff5a52;
    --green:#6ee37a;
    --green-bright:#a8e86a;
    --red-dark:#a83b36;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:dark}
  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--txt);
    font-family:"Barlow","Noto Sans SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:34px 26px 90px;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(1200px 580px at 50% -12%, rgba(255,210,30,.075), transparent 68%),
      radial-gradient(1000px 560px at 100% 110%, rgba(79,208,224,.055), transparent 70%),
      linear-gradient(rgba(130,150,170,.045) 1px, transparent 1px) 0 0/100% 52px,
      linear-gradient(90deg, rgba(130,150,170,.045) 1px, transparent 1px) 0 0/52px 100%;
  }
  body::after{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.22;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.6) 0 1px, transparent 1px 3px);
  }

  .wrap{max-width:1620px;margin:0 auto}

  /* ============ 头部 ============ */
  .hud{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:22px;flex-wrap:wrap;
    padding-bottom:18px;margin-bottom:26px;
    border-bottom:1px solid var(--line);position:relative;
  }
  .hud::after{
    content:'';position:absolute;left:0;bottom:-1px;width:156px;height:2px;
    background:linear-gradient(90deg,var(--yellow),rgba(255,210,30,0));
  }
  .logo{
    font-family:var(--mono);font-size:12px;font-weight:700;
    letter-spacing:.46em;color:var(--yellow);opacity:.9;
  }
  h1{
    font-size:29px;font-weight:600;letter-spacing:.1em;margin-top:9px;line-height:1.2;
  }
  h1 span{color:var(--dim);font-weight:400;font-size:15px;letter-spacing:.15em;margin-left:12px}
  .stats{
    font-family:var(--mono);font-size:14px;color:var(--dim);
    letter-spacing:.04em;display:flex;align-items:baseline;flex-wrap:wrap;
    gap:8px 15px;
  }
  .stats > span{
    display:inline-flex;align-items:baseline;
    padding-left:15px;position:relative;
  }
  .stats > span + span::before{
    content:'';position:absolute;left:0;top:50%;
    transform:translateY(-50%);width:1px;height:12px;
    background:rgba(255,255,255,.09);
  }
  .stats > span:first-child{padding-left:0}
  .stats .k{
    color:#6b7681;letter-spacing:.1em;
    margin-right:5px;                   /* 防止 "5" 与后面的字连读成一串 */
  }
  .stats b{
    color:var(--txt);font-weight:600;font-size:15px;
    letter-spacing:.02em;margin:0 2px;
  }
  .stats .soon b{color:var(--green-bright)}
  .stats .drain b{color:var(--red)}

  /* ============ 面板 ============ */
  .panel{
    position:relative;background:var(--panel);
    border:1px solid var(--line);
    backdrop-filter:blur(2px);
  }
  .panel::before,.panel::after{
    content:'';position:absolute;height:2px;width:92px;background:var(--yellow);
  }
  .panel::before{top:-1px;left:-1px}
  .panel::after{bottom:-1px;right:-1px;opacity:.45}

  .tableWrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
  .tableWrap::-webkit-scrollbar{height:10px}
  .tableWrap::-webkit-scrollbar-track{background:#0b0e12}
  .tableWrap::-webkit-scrollbar-thumb{background:#2a333c}
  .tableWrap::-webkit-scrollbar-thumb:hover{background:var(--yellow)}

  .tableInner{min-width:1460px}

  .grid{
    display:grid;align-items:center;column-gap:14px;
    grid-template-columns:30px minmax(180px,1.6fr) minmax(110px,1fr) 126px 112px 112px 126px 120px 218px 84px;
  }

  /* ============ 表头 ============ */
  .thead{
    height:54px;padding:0 22px;
    font-size:12px;letter-spacing:.17em;color:var(--dim);
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.018);
    text-transform:uppercase;
  }
  .thead > div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thead > div:nth-child(5),
  .thead > div:nth-child(6),
  .thead > div:nth-child(7),
  .thead > div:nth-child(8),
  .thead > div:nth-child(9){text-align:right}

  /* ============ 数据行 ============ */
  .trow{
    padding:0 22px;min-height:84px;
    position:relative;
    border-bottom:1px solid rgba(255,255,255,.045);
    transition:background .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .trow:last-child{border-bottom:none}
  .trow:hover{
    background:rgba(255,210,30,.035);
    box-shadow:inset 2px 0 0 rgba(255,210,30,.75);
  }
  .trow.is-editing{
    background:rgba(255,210,30,.05);
    box-shadow:inset 2px 0 0 var(--yellow);
  }

  /* 拖拽中 / 放置指示线 */
  .trow.dragging{opacity:.3}
  .trow.drop-before::before,
  .trow.drop-after::after{
    content:'';position:absolute;left:0;right:0;height:3px;
    background:var(--yellow);z-index:6;pointer-events:none;
    box-shadow:0 0 12px rgba(255,210,30,.6);
  }
  .trow.drop-before::before{top:-1px}
  .trow.drop-after::after{bottom:-1px}

  .cell{min-width:0}

  /* 拖拽手柄：圆角矩形 */
  .handle{
    width:30px;height:30px;margin:0 auto;
    display:grid;place-items:center;
    color:#4a545e;font-size:17px;line-height:1;
    cursor:grab;user-select:none;-webkit-user-select:none;
    border:1px solid transparent;
    border-radius:8px;
    transition:.15s ease;
  }
  .handle:hover{color:var(--yellow);border-color:var(--line);background:rgba(255,210,30,.08)}
  .handle:active{cursor:grabbing;color:var(--yellow)}

  /* ===== 名称列：图标 + 纯文本 / 下拉框 ===== */
  .name-cell{
    display:flex;align-items:center;gap:11px;
    min-width:0;
    cursor:default;
  }
  .item-icon{
    width:38px;height:38px;flex:0 0 auto;
    border:1px solid var(--line);
    background-color:rgba(255,255,255,.035);
    background-size:contain;
    background-position:center;
    background-repeat:no-repeat;
    position:relative;
    pointer-events:none;
    user-select:none;
    -webkit-user-select:none;
    transition:border-color .15s ease, background-color .15s ease;
  }
  .name-cell:hover .item-icon{border-color:rgba(255,210,30,.35)}
  .item-icon::after{
    content:'';position:absolute;inset:3px;
    background:
      linear-gradient(45deg, transparent 46%, rgba(255,255,255,.055) 46%, rgba(255,255,255,.055) 54%, transparent 54%),
      linear-gradient(-45deg, transparent 46%, rgba(255,255,255,.055) 46%, rgba(255,255,255,.055) 54%, transparent 54%);
    pointer-events:none;
    opacity:0;
    transition:opacity .2s ease;
  }
  .item-icon.is-empty::after{opacity:1}

  /* 查看态显示的纯文本 */
  .name-cell .view-text{
    flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    cursor:text;
  }
  .name-cell select.inp{flex:1 1 auto;min-width:0;cursor:pointer}

  /* 地区列 */
  .region-cell{min-width:0}
  .region-cell .view-text{
    display:block;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    cursor:text;
  }
  .region-cell select.inp{width:100%}

  /* 显隐切换：查看态显示文本，编辑态显示下拉框 */
  .trow:not(.is-editing) .name-cell select.inp,
  .trow:not(.is-editing) .region-cell select.inp{display:none}
  .trow.is-editing .name-cell .view-text,
  .trow.is-editing .region-cell .view-text{display:none}

  /* 备注列：纯文本输入 */
  .inp.remark{
    font-weight:400;
    letter-spacing:.02em;
    color:#c3ccd4;
  }

  /* 输入控件 */
  .inp{
    width:100%;font:inherit;font-size:15.5px;
    color:var(--txt);background:transparent;
    border:1px solid transparent;
    border-bottom:1px solid rgba(255,255,255,.11);
    padding:8px 8px;outline:none;border-radius:0;
    transition:border-color .15s, background .15s, color .15s;
  }
  .inp::placeholder{color:#414b55}
  .inp:hover{border-bottom-color:rgba(255,210,30,.4)}
  .inp:focus{
    border-bottom-color:var(--yellow);
    background:rgba(255,210,30,.07);
  }
  .inp.num{
    font-family:var(--mono);text-align:right;
    font-variant-numeric:tabular-nums;letter-spacing:.01em;
    -moz-appearance:textfield;appearance:textfield;
  }
  .inp.num::-webkit-outer-spin-button,
  .inp.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  /* ===== 下拉框（编辑态使用） ===== */
  select.inp{
    appearance:none;-webkit-appearance:none;cursor:pointer;
    padding-right:26px;
    background-image:
      linear-gradient(45deg,transparent 50%,var(--dim) 50%),
      linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 14px) 54%, calc(100% - 8px) 54%;
    background-size:6px 6px,6px 6px;
    background-repeat:no-repeat;
  }
  select.inp option{background:#12161a;color:var(--txt)}
  select.inp:disabled{color:var(--txt);opacity:1;-webkit-text-fill-color:var(--txt);cursor:default}

  /* ===== 查看态：input 只读但可选中复制 ===== */
  .trow:not(.is-editing) input.inp{
    border-bottom-color:transparent;
    background:transparent;
    cursor:text;
    user-select:text;
    -webkit-user-select:text;
    pointer-events:auto;
  }
  .trow:not(.is-editing) input.inp:hover{
    border-bottom-color:transparent;
  }
  .trow:not(.is-editing) input.inp:focus{
    border-bottom-color:transparent;
    background:transparent;
  }

  /* 剩余容量 + 进度条 */
  .cell.remain{position:relative}
  .remain-val{
    font-family:var(--mono);font-size:15.5px;text-align:right;
    font-variant-numeric:tabular-nums;color:#b6bfc7;
  }
  .bar{
    position:absolute;left:0;right:0;
    top:calc(100% + 7px);
    height:4px;background:rgba(255,255,255,.075);
    overflow:hidden;pointer-events:none;
  }
  .bar i{
    position:absolute;left:0;top:0;bottom:0;width:0;
    background:linear-gradient(90deg,#6b5400,var(--yellow));
    transition:width .35s ease, background .35s ease;
  }

  /* ============ 倒计时 ============ */
  .cd{text-align:right;padding-right:2px}
  .cd-time{
    font-family:var(--mono);font-size:22px;font-weight:600;
    letter-spacing:.02em;line-height:1.15;
    font-variant-numeric:tabular-nums;
    color:var(--dim);
  }
  .cd-sub{
    font-family:var(--mono);font-size:12px;color:#4d5762;
    letter-spacing:.03em;margin-top:4px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .cd-eta{
    font-family:var(--mono);font-size:11.5px;color:#3f4850;
    letter-spacing:.02em;margin-top:3px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
    font-variant-numeric:tabular-nums;
  }

  /* 生产 > 消耗：绿色，爆仓倒计时（目标达成） */
  .st-filling .cd-time{color:var(--green);text-shadow:0 0 16px rgba(110,227,122,.32)}
  .st-filling .cd-eta{color:#5a7a5e}

  /* 消耗 > 生产：红色，耗尽倒计时（危险） */
  .st-draining .cd-time{color:var(--red);text-shadow:0 0 16px rgba(255,90,82,.4)}
  .st-draining .cd-eta{color:#8a4a48}

  /* 已爆仓：亮绿，目标已达成 */
  .st-full .cd-time{color:var(--green-bright);text-shadow:0 0 16px rgba(168,232,106,.38)}

  /* 已耗尽：暗红，最严重 */
  .st-empty .cd-time{color:var(--red-dark);text-shadow:0 0 12px rgba(168,59,54,.4)}

  /* 产销平衡：静默灰 */
  .st-idle .cd-time{color:#4e5862}

  @keyframes urgent{
    0%,100%{opacity:1}
    50%{opacity:.28}
  }
  .cd-time.urgent{animation:urgent 1s steps(1,end) infinite}

  /* 操作按钮 */
  .act{display:flex;gap:6px;justify-content:flex-end}
  .ico{
    width:32px;height:32px;display:grid;place-items:center;
    background:transparent;border:1px solid var(--line);
    color:#5b656f;font-size:13px;line-height:1;cursor:pointer;
    transition:.15s ease;flex:0 0 auto;
  }
  .ico:hover{border-color:var(--yellow);color:var(--yellow);background:rgba(255,210,30,.1)}
  .ico.del:hover{border-color:var(--red);color:var(--red);background:rgba(255,90,82,.1)}
  .ico.on{border-color:var(--yellow);color:var(--yellow);background:rgba(255,210,30,.15)}

  /* 空状态 */
  .empty{
    padding:70px 20px;text-align:center;
    color:var(--dim);font-size:14px;letter-spacing:.18em;
  }

  /* ============ 工具栏 ============ */
  .toolbar{
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    margin-top:24px;
  }
  .btn{
    font:inherit;font-size:14.5px;letter-spacing:.12em;
    padding:13px 28px;cursor:pointer;
    color:var(--yellow);background:transparent;
    border:1px solid rgba(255,210,30,.42);
    transition:.15s ease;position:relative;
  }
  .btn:hover{background:rgba(255,210,30,.13);border-color:var(--yellow)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{color:var(--dim);border-color:var(--line)}
  .btn.ghost:hover{color:var(--red);border-color:rgba(255,90,82,.55);background:rgba(255,90,82,.08)}

  .hint{
    font-family:var(--mono);font-size:12.5px;color:#4b545d;letter-spacing:.05em;
  }

  /* ============ 右下角开源地址 ============ */
  .repo{
    margin-left:auto;                    /* 推到工具栏最右侧 */
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 14px;font-size:13.5px;letter-spacing:.06em;
    color:#8b959e;text-decoration:none;border:1px solid var(--line);
    transition:color .15s ease,border-color .15s ease,background .15s ease;
  }
  .repo svg{width:16px;height:16px;flex:0 0 auto;display:block}
  .repo:hover{
    color:var(--yellow);border-color:rgba(255,210,30,.42);
    background:rgba(255,210,30,.08);
  }
  .repo:active{transform:translateY(1px)}

  /* ============ 同步状态（真实推送由 Worker 完成，这里只反映数据是否送达） ============ */
  .stats .nstat{gap:7px}
  .nstat .dot{width:7px;height:7px;flex:0 0 auto;background:#3a424a;border-radius:50%}
  .nstat .lbl{color:#8b959e;margin:0}
  .nstat.is-off .dot{background:#3a424a}
  .nstat.is-idle .dot{background:var(--cyan)}
  .nstat.is-ok{color:#7f8b95}
  .nstat.is-ok .dot{background:var(--green);box-shadow:0 0 8px rgba(110,227,122,.7)}
  .nstat.is-err{color:var(--red)}
  .nstat.is-err .dot{background:var(--red);box-shadow:0 0 8px rgba(255,90,82,.7)}
  .nstat.is-save .dot{background:var(--yellow)}

  .ntPanel{margin-top:18px;border:1px solid var(--line);background:rgba(255,255,255,.014)}
  .ntPanel > summary{
    cursor:pointer;list-style:none;padding:13px 20px;
    font-family:var(--mono);font-size:12.5px;letter-spacing:.18em;color:var(--dim);
    transition:color .15s ease,background .15s ease;
  }
  .ntPanel > summary::-webkit-details-marker{display:none}
  .ntPanel > summary:hover{color:var(--yellow);background:rgba(255,210,30,.045)}
  .ntPanel[open] > summary{color:var(--yellow);border-bottom:1px solid var(--line)}
  .ntPanel .sumDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3a424a;margin-right:10px}
  .ntPanel[data-state="ok"] .sumDot{background:var(--green)}
  .ntPanel[data-state="err"] .sumDot{background:var(--red)}
  .ntPanel[data-state="save"] .sumDot{background:var(--yellow)}

  .ntBody{padding:20px;display:flex;flex-direction:column;gap:16px}
  .ntGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px 20px}
  .ntGrid label{display:block}
  .ntGrid .k{
    display:block;font-size:12.5px;color:var(--dim);
    letter-spacing:.1em;margin-bottom:6px;
  }
  .ntGrid .tip{
    display:block;font-family:var(--mono);font-size:11.5px;color:#4b545d;
    letter-spacing:.03em;margin-top:6px;line-height:1.5;
  }
  .ntGrid input[type=text],.ntGrid input[type=number]{
    width:100%;font:inherit;font-size:14px;color:var(--txt);
    background:rgba(255,255,255,.03);border:1px solid var(--line);
    padding:9px 11px;outline:none;border-radius:0;
    font-family:var(--mono);transition:border-color .15s ease;
  }
  .ntGrid input[type=text]:focus,.ntGrid input[type=number]:focus{
    border-color:var(--yellow);background:rgba(255,210,30,.06);
  }
  .ntGrid input::placeholder{color:#3d454e}

  .ntToggles{display:flex;flex-wrap:wrap;gap:10px 26px}
  .ntChk{
    display:inline-flex;align-items:center;gap:9px;cursor:pointer;
    font-size:13.5px;color:#aab3bb;user-select:none;
  }
  .ntChk input{width:15px;height:15px;accent-color:var(--yellow);cursor:pointer;margin:0}

  .ntActions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .btn.sm{padding:9px 17px;font-size:13px;letter-spacing:.09em}
  .btn.ghost.red:hover{color:var(--red);border-color:rgba(255,90,82,.55);background:rgba(255,90,82,.08)}

  .ntMsg{
    font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;
    color:#5c666f;line-height:1.6;word-break:break-all;
  }
  .ntMsg.is-ok{color:var(--green-bright)}
  .ntMsg.is-err{color:var(--red)}

  @media (max-width:640px){
    .ntBody{padding:15px}
    .ntGrid{grid-template-columns:1fr}
  }

  .foot{
    margin-top:44px;text-align:center;
    font-family:var(--mono);font-size:12.5px;
    letter-spacing:.3em;color:#3a424a;
  }
  /* 中文配超大等宽字距会散，这里单独收一下；版本号用 <b> 恢复常规字距，读起来清楚 */
  .foot b{font-weight:600;letter-spacing:.06em;color:#4e5860;margin-left:.3em}

  @media (max-width:640px){
    body{padding:20px 12px 64px}
    h1{font-size:21px}
    h1 span{display:block;margin:7px 0 0;font-size:13px}
    .stats{font-size:12.5px;gap:14px}
    .thead{height:48px;font-size:11px}
    .trow{min-height:80px}
    .inp{font-size:14.5px}
    .item-icon{width:32px;height:32px}
    .cd-time{font-size:19px}
    .btn{padding:11px 18px;font-size:13.5px}
    .hint{font-size:11.5px;flex:1 1 100%}   /* 窄屏：占满整行，把 GitHub 链接挤到下一行右对齐 */
    .repo{padding:8px 12px;font-size:12.5px}
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="hud">
    <div class="brand">
      <div class="logo">ENDFIELD</div>
      <h1>产线倒计时<span>PRODUCTION LINE MONITOR</span></h1>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="panel">
    <div class="tableWrap">
      <div class="tableInner">
        <div class="grid thead">
          <div></div>
          <div>产物名称</div>
          <div>备注</div>
          <div>地区</div>
          <div>生产/分</div>
          <div>消耗/分</div>
          <div>当前存量</div>
          <div>剩余容量</div>
          <div>倒计时</div>
          <div></div>
        </div>
        <div id="rows"></div>
      </div>
    </div>
  </div>

  <details class="ntPanel" id="ntPanel" data-state="off">
    <summary><span class="sumDot"></span>通知设置 · SERVERCHAN PUSH</summary>
    <div class="ntBody">
      <div class="ntGrid">
        <label>
          <span class="k">Worker 地址</span>
          <input type="text" id="ntUrl" placeholder="https://xxx.workers.dev" autocomplete="off" spellcheck="false">
          <span class="tip">在 Cloudflare 部署的 Worker 地址</span>
        </label>

<!-- 物品配置（放在主脚本之前） -->
<script src="items.js"></script>

<script>
(function () {
  'use strict';

  /* ================= 配置 ================= */
  const STORE_KEY = 'endfield_line_timer_v2';
  const STORE_KEY_LEGACY = 'endfield_line_timer_v1';   // 老数据迁移用
  /* 页面版本。Worker 会在 /sync 响应里回自己的版本，两者不一致就提示重新部署 */
  const PAGE_VERSION = '1.7.0';
  const LIMITS = { gudi: 80000, wuling: 90000 };
  const ICON_DIR = 'items/';
  const ICON_EXT = '.png';

  const rowsEl   = document.getElementById('rows');
  const statsEl  = document.getElementById('stats');
  const addBtn   = document.getElementById('addBtn');
  const clearBtn = document.getElementById('clearBtn');

  /* 通知模块：在文件后段赋值（paintStats 会在启动阶段先跑到，所以这里必须提前声明） */
  let notify = null;
  /* 自上次同步以来本地数据是否被改过。false 时前端只做"心跳"，Worker 不写任何键 —— 
     KV 免费版每天只有 1000 次写，靠这个把消耗压低一个数量级。 */
  var dataDirty = true;

  /* ================= 物品列表（来自 items.js） ================= */
  const FALLBACK_ITEMS = ['源石碎片', '碳素结晶', '精密零件'];

  function getItems() {
    let list = window.ITEMS_CONFIG;
    if (!Array.isArray(list)) list = [];

    const seen = Object.create(null);
    const out = [];
    list.forEach(function (n) {
      if (typeof n !== 'string') return;
      n = n.trim();
      if (!n || seen[n]) return;
      seen[n] = true;
      out.push(n);
    });

    return out.length ? out : FALLBACK_ITEMS.slice();
  }

  function iconUrl(name) {
    if (!name) return '';
    return ICON_DIR + encodeURIComponent(name) + ICON_EXT;
  }

  function regionLabel(v) {
    return v === 'gudi' ? '四号谷地' : '武陵';
  }

  /* ================= 数据 ================= */
  const ITEMS = getItems();

  let rows = load() || seed();

  rows.forEach(function (r) {
    if (typeof r.ts !== 'number' || !isFinite(r.ts) || r.ts <= 0) r.ts = Date.now();
    r.prod  = round2(Math.max(0, r.prod));
    r.cons  = round2(Math.max(0, r.cons));
    r.stock = Math.max(0, Math.floor(r.stock));
    r.editing = !!r.editing;
    if (typeof r.remark !== 'string') r.remark = '';
    if (typeof r.name !== 'string' || ITEMS.indexOf(r.name) < 0) {
      r.name = ITEMS[0];
    }
  });

  // 老数据迁移：只看不改也要落盘，否则数据会永远停在 v1 键上
  if (migratedFromLegacy) save();

  function uid() {
    return 'r' + Math.random().toString(36).slice(2, 10);
  }
  function num(v) {
    const n = Number(v);
    return Number.isFinite(n) ? n : 0;
  }
  function round2(v) {
    if (!Number.isFinite(v)) return 0;
    return Math.round((v + Number.EPSILON) * 100) / 100;
  }
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  function seed() {
    const t = Date.now();
    const pick = function (i) { return ITEMS[i] || ITEMS[0]; };
    return [
      { id: uid(), name: pick(0), remark: '主账号', region: 'wuling', prod: 24, cons: 6,  stock: 52000, ts: t, editing: false },
      { id: uid(), name: pick(1), remark: '主账号', region: 'wuling', prod: 15, cons: 15, stock: 30000, ts: t, editing: false },
      { id: uid(), name: pick(2), remark: '小号',   region: 'gudi',   prod: 8,  cons: 20, stock: 40000, ts: t, editing: false }
    ];
  }

  /* 老数据迁移：v1 键存在而 v2 键不存在时沿用一次，并在下次保存后清理 v1。
     用 var 而非 let：数据初始化段的迁移调用早于本行，let 会命中 TDZ。 */
  var migratedFromLegacy = false;

  function load() {
    try {
      let raw = localStorage.getItem(STORE_KEY);
      if (!raw) {
        raw = localStorage.getItem(STORE_KEY_LEGACY);
        if (raw) migratedFromLegacy = true;
      }
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!Array.isArray(data)) return null;
      return data.map(function (r) {
        return {
          id: r && r.id ? String(r.id) : uid(),
          name: r && typeof r.name === 'string' ? r.name : ITEMS[0],
          remark: r && typeof r.remark === 'string' ? r.remark : '',
          region: r && LIMITS[r.region] ? r.region : 'wuling',
          prod: round2(num(r && r.prod)),
          cons: round2(num(r && r.cons)),
          stock: Math.max(0, Math.floor(num(r && r.stock))),
          ts: (r && typeof r.ts === 'number' && r.ts > 0) ? r.ts : Date.now(),
          editing: !!(r && r.editing)
        };
      });
    } catch (e) {
      return null;
    }
  }

  function save() {
    dataDirty = true;      // 有任何改动，下次同步就必须把数据推上去
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(rows));
      if (migratedFromLegacy) {
        migratedFromLegacy = false;
        localStorage.removeItem(STORE_KEY_LEGACY);
      }
    } catch (e) { /* 忽略隐私模式等异常 */ }
  }

  /* ================= 核心：按时间锚点推算当前存量 ================= */
  function currentStock(row) {
    const cap  = LIMITS[row.region] || LIMITS.gudi;
    const prod = Math.max(0, num(row.prod));
    const cons = Math.max(0, num(row.cons));
    const net  = prod - cons;
    const base = Math.max(0, num(row.stock));
    const ts   = (typeof row.ts === 'number' && row.ts > 0) ? row.ts : Date.now();
    const elapsed = Math.max(0, (Date.now() - ts) / 1000);
    return clamp(base + net * elapsed / 60, 0, cap);
  }

  /* ================= 计算 ================= */
  function compute(row) {
    const cap  = LIMITS[row.region] || LIMITS.gudi;
    const prod = Math.max(0, num(row.prod));
    const cons = Math.max(0, num(row.cons));
    const net  = round2(prod - cons);

    const stock  = currentStock(row);
    const remain = Math.max(0, cap - stock);

    let state = 'idle';
    let seconds = null;

    if (net > 0) {
      if (remain <= 0) {
        state = 'full';
      } else {
        state = 'filling';
        seconds = remain / net * 60;
      }
    } else if (net < 0) {
      if (stock <= 0) {
        state = 'empty';
      } else {
        state = 'draining';
        seconds = stock / Math.abs(net) * 60;
      }
    } else {
      state = 'idle';
    }

    return { cap, stock, prod, cons, net, remain, state, seconds };
  }

  /* ================= 格式化 ================= */
  function fmtNum(n) {
    if (!Number.isFinite(n)) return '—';
    return Math.round(n).toLocaleString('en-US');
  }
  function fmtRate(n) {
    return String(round2(n));
  }
  function fmtDur(sec) {
    sec = Math.max(0, Math.floor(sec));
    const d = Math.floor(sec / 86400);
    const h = Math.floor((sec % 86400) / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    const p = function (n) { return String(n).padStart(2, '0'); };
    return d > 0
      ? d + '天 ' + p(h) + ':' + p(m) + ':' + p(s)
      : p(h) + ':' + p(m) + ':' + p(s);
  }
  function fmtEta(date) {
    const p = function (n) { return String(n).padStart(2, '0'); };
    const now = new Date();
    const prefix = (date.getFullYear() === now.getFullYear())
      ? ''
      : date.getFullYear() + '-';
    return prefix
      + p(date.getMonth() + 1) + '-' + p(date.getDate()) + ' '
      + p(date.getHours()) + ':' + p(date.getMinutes());
  }
  function escAttr(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ================= 渲染 ================= */
  function render() {
    rowsEl.innerHTML = '';

    if (rows.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '暂无产物 · 点击下方按钮添加';
      rowsEl.appendChild(empty);
      paintStats();
      return;
    }

    rows.forEach(function (row) {
      rowsEl.appendChild(buildRow(row));
    });
    tick();
  }

  function buildRow(row) {
    const el = document.createElement('div');
    el.className = 'grid trow';
    el.dataset.id = row.id;

    const nameOpts = ITEMS.map(function (n) {
      return '<option value="' + escAttr(n) + '">' + escAttr(n) + '</option>';
    }).join('');

    el.innerHTML =
      '<div class="cell"><div class="handle" draggable="true" title="按住拖动排序">⠿</div></div>' +
      '<div class="cell name-cell">' +
        '<div class="item-icon" data-icon></div>' +
        '<span class="view-text" data-k="name-view"></span>' +
        '<select class="inp sel" data-k="name">' + nameOpts + '</select>' +
      '</div>' +
      '<div class="cell"><input class="inp remark" data-k="remark" maxlength="32" value="' + escAttr(row.remark) + '"></div>' +
      '<div class="cell region-cell">' +
        '<span class="view-text" data-k="region-view"></span>' +
        '<select class="inp sel" data-k="region">' +
          '<option value="wuling">武陵</option>' +
          '<option value="gudi">四号谷地</option>' +
        '</select>' +
      '</div>' +
      '<div class="cell"><input class="inp num" type="number" min="0" step="0.01" data-k="prod" value="' + row.prod + '"></div>' +
      '<div class="cell"><input class="inp num" type="number" min="0" step="0.01" data-k="cons" value="' + row.cons + '"></div>' +
      '<div class="cell"><input class="inp num" type="number" min="0" step="1" data-k="stock" value="' + row.stock + '"></div>' +
      '<div class="cell remain">' +
        '<div class="remain-val">—</div>' +
        '<div class="bar"><i></i></div>' +
      '</div>' +
      '<div class="cell cd">' +
        '<div class="cd-time">--:--:--</div>' +
        '<div class="cd-sub"></div>' +
        '<div class="cd-eta"></div>' +
      '</div>' +
      '<div class="cell act">' +
        '<button class="ico edit-btn" type="button" title="修改">✎</button>' +
        '<button class="ico del" type="button" title="删除">✕</button>' +
      '</div>';

    el.querySelector('[data-k="name"]').value = row.name;
    el.querySelector('[data-k="region"]').value = row.region;
    el.querySelector('[data-k="name-view"]').textContent = row.name;
    el.querySelector('[data-k="region-view"]').textContent = regionLabel(row.region);

    applyIcon(el, row.name);

    const stockInput = el.querySelector('[data-k="stock"]');
    const prodInput  = el.querySelector('[data-k="prod"]');
    const consInput  = el.querySelector('[data-k="cons"]');

    /* -------- 拖拽排序 -------- */
    const handle = el.querySelector('.handle');

    handle.addEventListener('dragstart', function (e) {
      dragId = row.id;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', row.id);
      el.classList.add('dragging');
    });

    handle.addEventListener('dragend', function () {
      dragId = null;
      el.classList.remove('dragging');
      clearDropMarks();
    });

    /* -------- 文本/数字输入（仅编辑态生效） -------- */
    el.addEventListener('input', function (e) {
      const k = e.target.dataset.k;
      if (!k) return;
      if (e.target.tagName === 'SELECT') return;

      if (k === 'remark') {
        row.remark = e.target.value;
        save();
        return;
      }

      const frozen = Math.max(0, Math.floor(currentStock(row)));

      if (k === 'stock') {
        const raw = e.target.value;
        let iv = 0;
        if (raw !== '') {
          const n = parseFloat(raw);
          iv = Number.isFinite(n) ? Math.max(0, Math.floor(n)) : 0;
        }
        row.stock = iv;
        if (String(iv) !== raw) e.target.value = String(iv);
      } else if (k === 'prod' || k === 'cons') {
        row.stock = frozen;
        const raw = e.target.value;
        const n = raw === '' ? 0 : num(raw);
        row[k] = round2(Math.max(0, n));
      }
      row.ts = Date.now();

      if (document.activeElement !== stockInput) {
        stockInput.value = String(row.stock);
      }

      save();
      paint(el, row);
      paintStats();
    });

    /* -------- 下拉选择变更（名称 / 地区） -------- */
    el.addEventListener('change', function (e) {
      const k = e.target.dataset.k;
      if (k !== 'name' && k !== 'region') return;

      if (k === 'name') {
        row.name = e.target.value;
        applyIcon(el, row.name);
        const v = el.querySelector('[data-k="name-view"]');
        if (v) v.textContent = row.name;
        save();
        return;
      }

      row.stock = Math.max(0, Math.floor(currentStock(row)));
      row.ts = Date.now();
      row.region = e.target.value;
      if (document.activeElement !== stockInput) {
        stockInput.value = String(row.stock);
      }
      const v = el.querySelector('[data-k="region-view"]');
      if (v) v.textContent = regionLabel(row.region);

      save();
      paint(el, row);
      paintStats();
    });

    /* -------- 失焦：格式化显示 -------- */
    function onBlur(e) {
      const k = e.target.dataset.k;
      if (k === 'prod' || k === 'cons') {
        e.target.value = String(row[k]);
      } else if (k === 'stock') {
        e.target.value = String(row.stock);
      }
    }
    prodInput.addEventListener('blur', onBlur);
    consInput.addEventListener('blur', onBlur);
    stockInput.addEventListener('blur', onBlur);

    /* -------- 修改 / 删除 -------- */
    el.querySelector('.edit-btn').addEventListener('click', function () {
      toggleEditing(el, row);
    });

    el.querySelector('.del').addEventListener('click', function () {
      rows = rows.filter(function (r) { return r.id !== row.id; });
      save();
      render();
    });

    applyEditing(el, row);
    return el;
  }

  /* ================= 图标 ================= */
  function applyIcon(el, name) {
    const icon = el.querySelector('[data-icon]');
    if (!icon) return;

    const url = iconUrl(name);
    if (url) {
      icon.style.backgroundImage = 'url("' + url + '")';
      icon.classList.remove('is-empty');
    } else {
      icon.style.backgroundImage = '';
      icon.classList.add('is-empty');
    }
  }

  /* ================= 拖拽排序 ================= */
  let dragId = null;

  function clearDropMarks() {
    Array.prototype.forEach.call(
      rowsEl.querySelectorAll('.drop-before, .drop-after'),
      function (n) { n.classList.remove('drop-before', 'drop-after'); }
    );
  }

  function getRowAfter(y) {
    const list = Array.prototype.slice.call(
      rowsEl.querySelectorAll('.trow:not(.dragging)')
    );
    let closest = null;
    let closestOffset = -Infinity;

    list.forEach(function (child) {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closestOffset) {
        closestOffset = offset;
        closest = child;
      }
    });
    return closest;
  }

  rowsEl.addEventListener('dragover', function (e) {
    if (!dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';

    clearDropMarks();
    const after = getRowAfter(e.clientY);

    if (after) {
      after.classList.add('drop-before');
    } else {
      const list = Array.prototype.slice.call(
        rowsEl.querySelectorAll('.trow:not(.dragging)')
      );
      if (list.length) list[list.length - 1].classList.add('drop-after');
    }
  });

  rowsEl.addEventListener('dragleave', function (e) {
    if (!dragId) return;
    if (!rowsEl.contains(e.relatedTarget)) clearDropMarks();
  });

  rowsEl.addEventListener('drop', function (e) {
    if (!dragId) return;
    e.preventDefault();

    const after = getRowAfter(e.clientY);
    const fromIdx = rows.findIndex(function (r) { return r.id === dragId; });
    if (fromIdx < 0) { clearDropMarks(); return; }

    const moved = rows.splice(fromIdx, 1)[0];
    let toIdx;
    if (after) {
      toIdx = rows.findIndex(function (r) { return r.id === after.dataset.id; });
      if (toIdx < 0) toIdx = rows.length;
    } else {
      toIdx = rows.length;
    }
    rows.splice(toIdx, 0, moved);

    dragId = null;
    clearDropMarks();
    save();
    render();
  });

  /* ================= 编辑态切换 ================= */
  function applyEditing(el, row) {
    const on = !!row.editing;
    el.classList.toggle('is-editing', on);

    const btn = el.querySelector('.edit-btn');
    if (btn) {
      btn.textContent = on ? '✓' : '✎';
      btn.title = on ? '完成修改' : '修改';
      btn.classList.toggle('on', on);
    }

    el.querySelectorAll('input.inp').forEach(function (inp) {
      inp.readOnly = !on;
      inp.tabIndex = on ? 0 : -1;
    });

    el.querySelectorAll('select.inp').forEach(function (s) {
      s.disabled = !on;
    });

    const nameView = el.querySelector('[data-k="name-view"]');
    if (nameView) nameView.textContent = row.name;
    const regionView = el.querySelector('[data-k="region-view"]');
    if (regionView) regionView.textContent = regionLabel(row.region);
  }

  function toggleEditing(el, row) {
    if (row.editing) {
      row.stock = Math.max(0, Math.floor(currentStock(row)));
      row.ts = Date.now();
      row.editing = false;
    } else {
      row.stock = Math.max(0, Math.floor(currentStock(row)));
      row.ts = Date.now();
      row.editing = true;

      const set = function (k, v) {
        const inp = el.querySelector('[data-k="' + k + '"]');
        if (inp) inp.value = String(v);
      };
      set('remark', row.remark);
      set('prod', row.prod);
      set('cons', row.cons);
      set('stock', row.stock);
      const nameSel = el.querySelector('[data-k="name"]');
      if (nameSel) nameSel.value = row.name;
      const regionSel = el.querySelector('[data-k="region"]');
      if (regionSel) regionSel.value = row.region;
    }

    applyEditing(el, row);
    save();
    notify.onEditingChange();
    paint(el, row);
    paintStats();
  }

  /* ================= 通知（Server酱 经 Cloudflare Worker） ================= */
  notify = (function () {
    const CFG_KEY = 'endfield_notify_v1';
    const CLIENT_KEY = 'endfield_client_v1';       // 本 origin 的身份，用于区分"哪个页面是通知源"
    const DECLINE_KEY = 'endfield_import_declined'; // 记下"这次不导入"，避免每 60 秒反复问
    const CLAIM_TS_KEY = 'endfield_claim_at';       // 最近一次接管的时间
    const QUOTA_TS_KEY = 'endfield_quota_at';       // KV 额度用尽的时间（跨刷新保留）
    const CLAIM_QUIET_MS = 10 * 60 * 1000;          // 接管后这段时间内不再追问导入

    const $ = function (id) { return document.getElementById(id); };
    const urlEl = $('ntUrl');
    const tokenEl = $('ntToken');
    const warnEl = $('ntWarn');
    const onEl = $('ntOn');
    const fullEl = $('ntWarnFull');
    const emptyEl = $('ntWarnEmpty');
    const testBtn = $('ntTest');
    const nowBtn = $('ntNow');
    const resetBtn = $('ntReset');
    const claimBtn = $('ntClaim');
    const msgEl = $('ntMsg');
    const panelEl = $('ntPanel');

    let status = 'off';       // off | idle | ok | err | save | blocked
    let detail = '未开启 · 数据只保存在本机';
    let lastPushAt = 0;
    let syncTimer = null;
    let wasEditing = false;
    let blockedOwner = '';    // 当前占着 Worker 的那个页面
    let foreignRows = 0;      // Worker 里属于别的页面的残留行数
    let claimedAt = 0;        // 本页面最近一次接管的时间
    let quotaAt = 0;          // KV 额度用尽的时间（0 = 正常）
    let readOnly = false;     // 用户选了"不导入"，本页面保持只读
    let claiming = false;

    /**
     * 补全协议。用户常常只填 "xxx.workers.dev" 而漏掉 https://，
     * 那样浏览器会把它当成相对路径拼到当前页面后面
     * （ https://你的页面/xxx.workers.dev/test ），得到的是 404/405 而不是 Worker 的响应。
     */
    function normalizeUrl(v) {
      let s = String(v == null ? '' : v).trim();
      if (!s) return '';
      if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = 'https://' + s;
      return s.replace(/\/+$/, '');
    }

    function loadCfg() {
      let raw = null;
      try { raw = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch (e) { raw = null; }
      const c = raw && typeof raw === 'object' ? raw : {};
      // 老配置里只有 warnEmpty（且默认开启），迁移时让爆仓方向保持开启
      const legacyEmpty = c.warnEmpty !== false;
      return {
        url: normalizeUrl(c.url),
        token: typeof c.token === 'string' ? c.token : '',
        warn: Number.isFinite(Number(c.warn)) && Number(c.warn) > 0 ? Math.floor(Number(c.warn)) : 30,
        on: !!c.on,
        warnFull: typeof c.warnFull === 'boolean' ? c.warnFull : true,
        warnEmpty: typeof c.warnEmpty === 'boolean' ? c.warnEmpty : legacyEmpty
      };
    }

    /* 本 origin 的稳定身份。换域名就是新身份，从而触发"要不要导入旧数据"的询问 */
    function clientId() {
      let id = '';
      try { id = localStorage.getItem(CLIENT_KEY) || ''; } catch (e) { id = ''; }
      if (!id) {
        id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        try { localStorage.setItem(CLIENT_KEY, id); } catch (e) { /* 忽略 */ }
      }
      return id;
    }

    function declinedFor() {
      try { return localStorage.getItem(DECLINE_KEY) || ''; } catch (e) { return ''; }
    }
    function setDeclined(v) {
      try { v ? localStorage.setItem(DECLINE_KEY, v) : localStorage.removeItem(DECLINE_KEY); } catch (e) { /* 忽略 */ }
    }

    function readClaimTs() {
      try { return Number(localStorage.getItem(CLAIM_TS_KEY)) || 0; } catch (e) { return 0; }
    }
    function markClaimed() {
      try { localStorage.setItem(CLAIM_TS_KEY, String(Date.now())); } catch (e) { /* 忽略 */ }
    }

    /* KV 额度用尽的状态要跨刷新保留：只读/无改动的请求不写 KV，
       不能因为"这次请求本身成功"就显示绿灯。 */
    /* 额度重置时间：Cloudflare 按 UTC 零点重置额度，即北京时间每天 8:00 */
    function quotaResetHint() {
      return '每天 8:00 点重置';
    }

    function readQuotaAt() {
      try { return Number(localStorage.getItem(QUOTA_TS_KEY)) || 0; } catch (e) { return 0; }
    }
    function setQuotaAt(v) {
      quotaAt = Number(v) || 0;
      try { v ? localStorage.setItem(QUOTA_TS_KEY, String(v)) : localStorage.removeItem(QUOTA_TS_KEY); } catch (e) { /* 忽略 */ }
    }

    let cfg = loadCfg();
    const ready = function () { return !!cfg.url && !!cfg.token; };
    const enabled = function () { return cfg.on && ready(); };
    const base = function () { return cfg.url.replace(/\/+$/, ''); };

    function persist() {
      try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) { /* 忽略隐私模式等异常 */ }
    }

    function setStatus(state, text) {
      status = state;
      if (text) detail = text;
      if (panelEl) panelEl.dataset.state = (state === 'blocked' ? 'err' : state);
      if (msgEl) {
        msgEl.textContent = detail;
        msgEl.className = 'ntMsg' + (state === 'ok' ? ' is-ok' : (state === 'err' || state === 'blocked' ? ' is-err' : ''));
      }
      if (claimBtn) claimBtn.style.display = (state === 'blocked' || readOnly) ? '' : 'none';
      paintStats();
    }

    function hostOf(u) {
      try { return new URL(normalizeUrl(u)).host; } catch (e) { return String(u || '').replace(/^https?:\/\//i, '').split('/')[0]; }
    }

    /* 右上角反映的是"数据同步状态"：真正的推送是 Worker 干的活，网页端只负责把数据送达。
       目标域名移到 title 提示里，节省横向空间。 */
    function hudHtml() {
      const DISABLED_TIP = '通知推送由 Cloudflare Worker 负责；网页端只负责把数据同步过去';

      if (!cfg.on) {
        return '<span class="nstat is-off" title="' + escAttr(DISABLED_TIP) + '">'
          + '<i class="dot"></i><span class="lbl">同步 未开启</span></span>';
      }
      if (!ready()) {
        return '<span class="nstat is-err" title="' + escAttr(DISABLED_TIP) + '">'
          + '<i class="dot"></i><span class="lbl">同步 未配置</span></span>';
      }

      const label = {
        off: '同步 未开启',
        idle: '同步 待发送',
        ok: '同步 正常',
        err: '同步 异常',
        save: '同步 进行中',
        blocked: '同步 待确认'
      }[status] || '同步';

      const cls = status === 'save' ? 'is-save'
        : (status === 'blocked' ? 'is-err'
          : (status === 'err' ? 'is-err' : (status === 'ok' ? 'is-ok' : 'is-idle')));

      const tip = label + ' · ' + hostOf(cfg.url) + '\n' + DISABLED_TIP
        + '\n\n最近一次：' + (detail || '—');
      return '<span class="nstat ' + cls + '" title="' + escAttr(tip) + '">'
        + '<i class="dot"></i><span class="lbl">' + escAttr(label) + '</span></span>';
    }

    /* 与 Worker 的 projectStock 对齐：同步的是时间锚点，不是当前数值 */
    function buildPayload(extra) {
      const t = Date.now();
      const list = [];
      rows.forEach(function (r) {
        list.push({
          id: r.id,
          name: r.name,
          remark: r.remark || '',
          region: r.region,
          prod: r.prod,
          cons: r.cons,
          stock: r.stock,
          ts: (typeof r.ts === 'number' && r.ts > 0) ? r.ts : t
        });
      });
      const body = {
        v: 2,
        clientId: clientId(),
        clientHost: location.host,
        clientTs: t,
        dirty: dataDirty,
        quotaAt: quotaAt || 0,      // 回显给 Worker：额度用尽时它自己写不进 KV，只能靠页面记着
        warnMinutes: cfg.warn,
        alertTypes: alertTypes(),
        rows: list
      };
      return JSON.stringify(extra ? Object.assign(body, extra) : body);
    }

    /** 当前启用的提醒方向，随快照一起同步给 Worker */
    function alertTypes() {
      return { full: !!cfg.warnFull, empty: !!cfg.warnEmpty };
    }

    function applyReply(data, httpStatus, forced) {
      // Worker 返回了非 JSON（多为 Cloudflare 错误页）：把状态码和响应片段直接显示出来
      if (data && data.__nonJson) {
        setStatus('err', 'Worker 返回了非 JSON 响应 · ' + data.message);
        return;
      }

      // 409：另一个页面正占着 Worker，交给用户决定"导入旧数据"还是"用本地数据替换"
      if (httpStatus === 409 || (data && data.code === 'owner_mismatch')) {
        blockedOwner = (data && data.owner && data.owner.host) || '另一个页面';
        foreignRows = num(data && data.rows, 0);
        askImport();
        return;
      }

      if (!data || data.ok !== 1) {
        setStatus('err', '同步失败：' + ((data && data.message) || '未知错误'));
        return;
      }

      dataDirty = false;    // 本轮数据已经交给 Worker
      lastPushAt = Number(data.lastPushAt) || 0;

      // 版本对不上 → 多半是改了 worker.js 却没在 Cloudflare 重新部署。
      // 不提示的话，症状会是"功能莫名不生效"，完全查不出原因。
      const wv = data.worker || '';
      if (wv && wv !== PAGE_VERSION) {
        setStatus('err', 'Worker 版本不一致（页面 v' + PAGE_VERSION + ' / Worker v' + wv
          + '）· 请到 Cloudflare 重新粘贴部署 worker.js');
        return;
      }

      // KV 额度：命中就是错误态，必须红灯；只读时上报的历史记录同样要保留
      const qAt = num(data.quota, 0) ? (Number(data.quotaAt) || Date.now()) : Number(data.quotaAt) || 0;
      setQuotaAt(qAt);
      if (quotaAt) {
        setStatus('err', 'KV 写入额度已用尽（免费版 1000 次/天，' + quotaResetHint() + '）');
        return;
      }

      // 刚接管完的那段时间里，KV 里还留着旧 client 的行（要缺席两轮才清掉）。
      // 那不是"新发现的旧数据"，不该再问一次，否则接管成功后会立刻被重复追问。
      const foreign = num(data.foreignRows, 0);
      const claimingRecently = Date.now() - num(claimedAt, 0) < CLAIM_QUIET_MS;
      if (foreign > 0 && !claimingRecently && !readOnly && declinedFor() !== clientId()) {
        foreignRows = foreign;
        blockedOwner = (data.owner && data.owner.host) || '';
        askImport();
        return;
      }

      if (data.lastPushOk === false && data.lastError) {
        setStatus('err', '推送异常：' + data.lastError);
      } else {
        const tail = foreign > 0
          ? (claimingRecently
            ? '（正在清理 ' + foreign + ' 条旧数据）'
            : '（另有 ' + foreign + ' 条别处数据待接管）')
          : (num(data.writes, 0) === 0 && !forced ? '（无改动，未写入）' : '');
        setStatus('ok', '已同步 ' + data.rows + ' 条 · '
          + (lastPushAt ? ('最近推送 ' + new Date(lastPushAt).toLocaleTimeString('zh-CN')) : '尚未推送') + tail);
      }
    }

    function num(v, dflt) {
      const n = Number(v);
      return Number.isFinite(n) ? n : dflt;
    }

    /**
     * 读响应体。Worker 出错时返回的可能是 HTML（Cloudflare 的错误页），
     * 直接 r.json() 只会抛出 "JSON.parse: unexpected character"，没有排查价值。
     * 这里统一按文本读，再尽力解析，解析不了就把响应片段原样带出来。
     */
    function readJson(r) {
      return r.text().then(function (t) {
        let data = null;
        try { data = JSON.parse(t); } catch (e) { /* 非 JSON，例如 HTML 错误页 */ }

        if (data) { data.__httpStatus = r.status; return data; }

        const snippet = String(t).replace(/\s+/g, ' ').trim().slice(0, 100);
        const hint = r.status === 404
          ? '（地址可能写错了，或 Worker 还没重新部署）'
          : (r.status >= 500 ? '（Worker 执行出错，检查 Cloudflare 日志）' : '');
        return {
          ok: 0,
          __httpStatus: r.status,
          __nonJson: true,
          message: 'HTTP ' + r.status + hint + '：' + (snippet || '（空响应）')
        };
      });
    }

    /**
     * 询问怎么处理 Worker 里已有的旧数据。三选一：
     *   确定 → 导入旧数据到本页面（换域名时选这个）
     *   确定后再问 → 用本页面数据替换（会清掉 Worker 上的旧数据）
     *   取消 → 什么都不做，本页面保持只读（不推数据、也不接管）
     */
    function askImport(manual) {
      if (claiming) return;
      setStatus('blocked',
        '此页面还不是通知源' + (blockedOwner ? '（当前：' + blockedOwner + '）' : '')
        + ' · Worker 里有 ' + foreignRows + ' 条其它页面的数据');

      const head = manual
        ? '把本页面设为唯一通知源？\n\n'
        : ('检测到 Worker 里已有另一份数据'
          + (blockedOwner ? '（来自 ' + blockedOwner + '）' : '')
          + '，共 ' + foreignRows + ' 条。\n\n');

      const useImport = confirm(
        head
        + '【确定】= 导入这份数据到本页面（推荐：换域名时选这个）\n'
        + '【取消】= 不导入' + (manual ? '（放弃接管）' : '，本页面保持只读')
      );

      if (!useImport) {
        // 记住"这次不导入"，避免每 60 秒再问一遍；真正的替换要用户明确选择
        setDeclined(clientId());
        readOnly = true;
        setStatus('ok', '已按只读方式运行 · 需要时点「接管为通知源」 · Worker 上的旧数据会逐步自动清理');
        return;
      }

      const useReplace = confirm(
        '要在导入之前先清掉 Worker 上的旧数据吗？\n\n'
        + '【取消】= 导入旧数据（推荐）\n'
        + '【确定】= 不要旧数据，改用本页面的数据替换'
      );
      claimAndSync(useReplace ? 'replace' : 'import');
    }

    /**
     * 接管为通知源。
     *   import  → 先把 Worker 的旧数据取回本页面，再接管
     *   replace → 先接管并清掉旧数据，再用本页面数据同步
     */
    function claimAndSync(mode) {
      if (claiming || !ready()) return;
      claiming = true;
      readOnly = false;
      claimedAt = Date.now();
      markClaimed();     // 接管后一段时间内不再追问导入
      setStatus('save', mode === 'import' ? '正在导入 Worker 数据…' : '正在替换为本地数据…');
      setDeclined('');   // 新的选择，清掉旧的"不导入"记忆

      const afterClaim = function () {
        return fetch(base() + '/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Sync-Token': cfg.token },
          body: buildPayload()
        }).then(function (r) { return readJson(r).then(function (j) { return applyReply(j, r.status); }); });
      };

      const doClaim = function () {
        return fetch(base() + '/claim', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Sync-Token': cfg.token },
          body: JSON.stringify({ clientId: clientId(), clientHost: location.host, mode: mode })
        }).then(function (r) {
          return readJson(r).then(function (j) {
            if (r.status !== 200 || !j || j.ok !== 1) {
              throw new Error((j && j.message) || ('接管失败 HTTP ' + r.status));
            }
            return j;
          });
        });
      };

      const pull = function () {
        return fetch(base() + '/snapshot', { headers: { 'X-Sync-Token': cfg.token } })
          .then(readJson)
          .then(function (j) {
            if (!j || j.ok !== 1) throw new Error((j && j.message) || '导出失败');
            if (!j.rows || !j.rows.length) return false;
            // 以 Worker 里的锚点为准写入本页面，刷新后由 render() 正常渲染
            rows = j.rows.map(function (r) {
              return {
                id: String(r.id),
                name: r.name,
                remark: typeof r.remark === 'string' ? r.remark : '',
                region: r.region === 'gudi' ? 'gudi' : 'wuling',
                prod: Number(r.prod) || 0,
                cons: Number(r.cons) || 0,
                stock: Math.max(0, Math.floor(Number(r.stock) || 0)),
                ts: Number(r.ts) || Date.now(),
                editing: false
              };
            });
            save();
            return true;
          });
      };

      const flow = mode === 'import'
        ? pull().then(function (got) {
            if (!got) setStatus('save', 'Worker 里没有可导入的数据，改用本地数据…');
            return doClaim().then(function () { return got; });
          })
        : doClaim().then(function () { return false; });

      flow.then(function (imported) {
        if (imported) {
          location.reload();      // 载入导入的数据，走一遍正常的加载路径
          return null;
        }
        return afterClaim();
      })
        .catch(function (e) {
          setStatus('err', (e && e.message) ? e.message : String(e));
        })
        .then(function () { claiming = false; });
    }

    function syncNow(force) {
      if (!enabled()) {
        setStatus(cfg.on ? 'err' : 'off', cfg.on ? '未填写 Worker 地址或同步令牌' : '未开启 · 数据只保存在本机');
        return Promise.resolve();
      }
      if (claiming) return Promise.resolve();
      // 只读（用户选了"不导入"）只约束**自动**同步；手动点「立即同步」是明确指令，
      // 照常发出去 —— 结果要么被 Worker 以 409 拒绝（会给出去向），要么真的推成功。
      if (readOnly && !force) return Promise.resolve();
      // force=true（手动点「立即同步」）不走差异检查：用户明确要求推送，就照推。
      // 省额度的 dirty 优化只该作用于自动同步，不该把手动操作也挡住。
      const dirty = (force || !readOnly) ? true : dataDirty;
      setStatus('save', force ? '正在推送全部数据…' : '正在同步…');
      return fetch(base() + '/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Sync-Token': cfg.token },
        body: buildPayload({ dirty: force ? true : dirty })
      }).then(function (r) { return readJson(r).then(function (j) { return applyReply(j, r.status, force); }); })
        .catch(function (e) { setStatus('err', '无法连接 Worker：' + (e && e.message ? e.message : e)); });
    }

    function scheduleSync(delay) {
      if (!enabled()) return;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(function () { syncNow(false); }, typeof delay === 'number' ? delay : 1500);
    }

    function beacon() {
      // 只有"确实有未同步的改动"时才在离开页面时补推；只读状态完全不碰 Worker
      if (!enabled() || readOnly || !dataDirty || !navigator.sendBeacon) return;
      try {
        navigator.sendBeacon(base() + '/sync',
          new Blob([buildPayload({ dirty: true })], { type: 'application/json' }));
      } catch (e) { /* 忽略 */ }
    }

    function refreshCfg() {
      cfg.url = normalizeUrl(urlEl.value);
      cfg.token = String(tokenEl.value || '').trim();
      const w = parseInt(warnEl.value, 10);
      cfg.warn = (Number.isFinite(w) && w > 0) ? w : 30;
      cfg.on = !!onEl.checked;
      cfg.warnFull = !!fullEl.checked;
      cfg.warnEmpty = !!emptyEl.checked;
      // 把补全后的地址回填到输入框，让用户看到实际会请求到哪里
      if (urlEl.value !== cfg.url) urlEl.value = cfg.url;
      persist();
    }

    function onEditingChange() {
      let editing = false;
      rows.forEach(function (r) { if (r.editing) editing = true; });
      if (wasEditing && !editing) {
        scheduleSync(900);          // 退出编辑态 → 尽快把最新锚点交给 Worker
      } else if (!wasEditing && editing) {
        clearTimeout(syncTimer);    // 进入编辑态 → 暂停推送，避开打字中间态
      }
      wasEditing = editing;
    }

    /* ---- 面板事件 ---- */
    [urlEl, tokenEl, warnEl].forEach(function (el) {
      el.addEventListener('input', function () {
        refreshCfg();
        paintStats();     // 预警分钟数变了，HUD 上的统计窗口要跟着变
        if (cfg.on && !ready()) setStatus('err', '未填写 Worker 地址或同步令牌');
        else if (enabled()) { setStatus('idle', '设置已更新，正在同步…'); scheduleSync(600); }
        else setStatus('off', '未开启 · 数据只保存在本机');
      });
    });

    [onEl, fullEl, emptyEl].forEach(function (el) {
      el.addEventListener('change', function () {
        refreshCfg();
        if (!cfg.on) { clearTimeout(syncTimer); setStatus('off', '未开启 · 数据只保存在本机'); return; }
        if (!ready()) { setStatus('err', '未填写 Worker 地址或同步令牌'); return; }
        scheduleSync(200);   // 提醒方向变了，把设置同步给 Worker
      });
    });

    testBtn.addEventListener('click', function () {
      refreshCfg();
      if (!ready()) { setStatus('err', '请先填写 Worker 地址与同步令牌'); return; }
      setStatus('save', '正在发送测试通知…');
      fetch(base() + '/test', { headers: { 'X-Sync-Token': cfg.token } })
        .then(readJson)
        .then(function (j) {
          if (j && j.ok === 1) setStatus('ok', '测试通知已发出，请查看 Server酱 App');
          else setStatus('err', '测试失败：code=' + (j && j.code != null ? j.code : '—') + ' ' + ((j && j.message) || ''));
        })
        .catch(function (e) { setStatus('err', '无法连接 Worker：' + (e && e.message ? e.message : e)); });
    });

    nowBtn.addEventListener('click', function () {
      refreshCfg();
      syncNow(true);      // 手动同步：不做差异检查，强制推一次
    });

    /* 接管为通知源：走与自动询问同一套三选一流程。
       用户主动点击 = 明确想反悔，所以先清掉"已决定不导入"的标记。 */
    claimBtn.addEventListener('click', function () {
      refreshCfg();
      if (!ready()) { setStatus('err', '请先填写 Worker 地址与同步令牌'); return; }
      setDeclined('');
      askImport(true);
    });

    resetBtn.addEventListener('click', function () {
      refreshCfg();
      if (!ready()) { setStatus('err', '请先填写 Worker 地址与同步令牌'); return; }
      if (!confirm('重置后，已经提醒过的产线会被允许再次提醒。确定吗？')) return;
      setStatus('save', '正在重置…');
      fetch(base() + '/reset-alerts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Sync-Token': cfg.token },
        body: '{}'
      }).then(readJson)
        .then(function (j) {
          if (j && j.ok === 1) setStatus('ok', '已重置 ' + j.reset + ' 条产线的提醒标记');
          else setStatus('err', '重置失败：' + ((j && j.message) || ''));
        })
        .catch(function (e) { setStatus('err', '无法连接 Worker：' + (e && e.message ? e.message : e)); });
    });

    /* ---- 启动 ---- */
    urlEl.value = cfg.url;
    tokenEl.value = cfg.token;
    warnEl.value = String(cfg.warn);
    onEl.checked = cfg.on;
    claimedAt = readClaimTs();
    quotaAt = readQuotaAt();
    fullEl.checked = cfg.warnFull;
    emptyEl.checked = cfg.warnEmpty;
    setStatus(
      quotaAt ? 'err' : (cfg.on ? (ready() ? 'idle' : 'err') : 'off'),
      quotaAt
        ? 'KV 写入额度已用尽（免费版 1000 次/天，' + quotaResetHint() + '）'
        : (cfg.on ? (ready() ? '等待首次同步…' : '未填写 Worker 地址或同步令牌') : '未开启 · 数据只保存在本机')
    );

    // 没有心跳定时器：挂机时不发任何请求。
    // 同步只在这些时刻发生：进入页面（仅当确有数据且未只读时一次）、
    // 确认修改退出编辑态、改动通知设置、点了「立即同步 / 接管 / 测试」。
    // 进入页面时补一次：让新页面认领数据源、并发现"Worker 上有别人的数据"。
    // 只读、或本地本来就没有数据（纯新建）时不发，避免制造上面那种空快照事故。
    if (enabled() && !readOnly && rows.length) scheduleSync(1500);

    window.addEventListener('pagehide', beacon);

    return {
      hudHtml: hudHtml,
      warnMinutes: function () { return cfg.warn; },
      scheduleSync: scheduleSync,
      syncNow: syncNow,
      onEditingChange: onEditingChange,
      state: function () {
        return {
          status: status, detail: detail,
          warnMinutes: cfg.warn, warnEmpty: cfg.warnEmpty, enabled: enabled()
        };
      }
    };
  })();

  /* ================= 局部刷新 ================= */
  function paint(el, row) {
    const c = compute(row);

    const remainVal = el.querySelector('.remain-val');
    const barI      = el.querySelector('.bar i');
    const cdTime    = el.querySelector('.cd-time');
    const cdSub     = el.querySelector('.cd-sub');
    const cdEta     = el.querySelector('.cd-eta');

    remainVal.textContent = fmtNum(c.remain);

    const ratio = clamp(c.stock / c.cap, 0, 1);
    barI.style.width = (ratio * 100).toFixed(1) + '%';

    // 进度条颜色按状态区分：爆仓用绿色，耗尽用红色
    let barGrad;
    if (c.state === 'full') {
      barGrad = 'linear-gradient(90deg,#3d7a1a,#a8e86a)';
    } else if (c.state === 'filling') {
      barGrad = 'linear-gradient(90deg,#2d5c14,#6ee37a)';
    } else if (c.state === 'empty') {
      barGrad = 'linear-gradient(90deg,#4a0f0c,#a83b36)';
    } else if (c.state === 'draining') {
      barGrad = 'linear-gradient(90deg,#7a1d18,#ff5a52)';
    } else {
      barGrad = 'linear-gradient(90deg,#6b5400,#ffd21e)';
    }
    barI.style.background = barGrad;

    el.classList.remove('st-filling', 'st-full', 'st-idle', 'st-draining', 'st-empty');
    cdTime.classList.remove('urgent');

    if (c.state === 'full') {
      el.classList.add('st-full');
      cdTime.textContent = '已爆仓';
      cdSub.textContent = '上限 ' + fmtNum(c.cap);
      cdEta.textContent = '';
    } else if (c.state === 'filling') {
      el.classList.add('st-filling');
      cdTime.textContent = fmtDur(c.seconds);
      cdSub.textContent = '净 +' + fmtRate(c.net) + ' /分';
      cdEta.textContent = '爆仓 ' + fmtEta(new Date(Date.now() + c.seconds * 1000));
      if (c.seconds < 1800) cdTime.classList.add('urgent');
    } else if (c.state === 'draining') {
      el.classList.add('st-draining');
      cdTime.textContent = fmtDur(c.seconds);
      cdSub.textContent = '净 ' + fmtRate(c.net) + ' /分';
      cdEta.textContent = '耗尽 ' + fmtEta(new Date(Date.now() + c.seconds * 1000));
      if (c.seconds < 1800) cdTime.classList.add('urgent');
    } else if (c.state === 'empty') {
      el.classList.add('st-empty');
      cdTime.textContent = '已耗尽';
      cdSub.textContent = '当前存量为 0';
      cdEta.textContent = '';
    } else {
      el.classList.add('st-idle');
      cdTime.textContent = '——';
      cdSub.textContent = '产销平衡';
      cdEta.textContent = '';
    }
  }

  /** 预警窗口秒数：以设置面板里的「预警提前量」为准，与 Worker 用的是同一个值 */
  function warnSeconds() {
    const m = notify && notify.warnMinutes ? notify.warnMinutes() : 0;
    return (m > 0 ? m : 30) * 60;
  }

  function paintStats() {
    const win = warnSeconds();          // 跟随设置，不再写死 1 小时
    const mins = Math.round(win / 60);
    let soon = 0, drain = 0;
    rows.forEach(function (r) {
      const c = compute(r);
      if (c.state === 'filling' && c.seconds < win) soon++;
      if (c.state === 'draining' && c.seconds < win) drain++;
    });
    statsEl.innerHTML =
      '<span><span class="k">产物</span><b>' + rows.length + '</b></span>' +
      '<span class="soon"><span class="k">' + mins + '分钟内爆仓</span><b>' + soon + '</b></span>' +
      '<span class="drain"><span class="k">' + mins + '分钟内耗尽</span><b>' + drain + '</b></span>' +
      (notify ? notify.hudHtml() : '');
  }

  /* ================= 每秒刷新 ================= */
  function tick() {
    rows.forEach(function (row) {
      const el = rowsEl.querySelector('[data-id="' + row.id + '"]');
      if (!el) return;

      const stockInput = el.querySelector('[data-k="stock"]');
      if (stockInput && document.activeElement !== stockInput) {
        const live = Math.max(0, Math.floor(currentStock(row)));
        if (stockInput.value !== String(live)) stockInput.value = String(live);
      }

      paint(el, row);
    });
    paintStats();
  }

  /* ================= 事件 ================= */
  addBtn.addEventListener('click', function () {
    const row = {
      id: uid(),
      name: ITEMS[0],
      remark: '',
      region: 'wuling',
      prod: 0, cons: 0, stock: 0,
      ts: Date.now(), editing: true
    };
    rows.push(row);
    save();
    render();
  });

  clearBtn.addEventListener('click', function () {
    if (rows.length === 0) return;
    if (!confirm('确定要清空全部产物数据吗？此操作不可撤销。')) return;
    rows = [];
    save();
    render();
  });

  /* ================= 启动 ================= */
  render();
  setInterval(tick, 1000);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) tick();
  });
})();
</script>
</body>
</html>
